<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Abstract ledger and balance chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1019"/>
      <stop offset="0.5" stop-color="#0d1522"/>
      <stop offset="1" stop-color="#121c2b"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b73" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff6b73" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a90"/>
      <stop offset="1" stop-color="#e0453d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b73" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff6b73" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="1450" cy="330" r="430" fill="url(#glow)"/>

  <!-- ledger rows behind the chart -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M700 420H1880"/>
    <path d="M700 510H1880"/>
    <path d="M700 600H1880"/>
    <path d="M700 690H1880"/>
    <path d="M700 780H1880"/>
    <path d="M700 870H1880"/>
  </g>

  <!-- value bars -->
  <g fill="#ffffff" fill-opacity="0.09">
    <rect x="760" y="640" width="30" height="230" rx="8"/>
    <rect x="820" y="700" width="30" height="170" rx="8"/>
    <rect x="880" y="600" width="30" height="270" rx="8"/>
    <rect x="940" y="740" width="30" height="130" rx="8"/>
    <rect x="1000" y="660" width="30" height="210" rx="8"/>
  </g>

  <!-- balance curve -->
  <path d="M700 800 L840 740 L980 770 L1120 650 L1260 690 L1400 560 L1540 600 L1680 450 L1820 500 L1880 470 L1880 900 L700 900 Z" fill="url(#area)"/>
  <path d="M700 800 L840 740 L980 770 L1120 650 L1260 690 L1400 560 L1540 600 L1680 450 L1820 500 L1880 470"
        fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>

  <!-- data points -->
  <g fill="#0a1019" stroke="#ff8a90" stroke-width="5">
    <circle cx="1120" cy="650" r="11"/>
    <circle cx="1400" cy="560" r="11"/>
    <circle cx="1680" cy="450" r="11"/>
  </g>

  <!-- faint currency marks -->
  <g fill="#ffffff" fill-opacity="0.055" font-family="Poppins, Arial, sans-serif" font-weight="700">
    <text x="1560" y="330" font-size="260">$</text>
    <text x="820" y="300" font-size="130">$</text>
  </g>
</svg>
