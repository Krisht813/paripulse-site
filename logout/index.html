<body class="auth-body">
  <main class="auth-main" style="min-height:100svh">
    <div class="auth-card" style="text-align:center">
      <img src="brand-mark.svg?v=20261124" alt="" width="42" height="42" style="display:inline-block;margin-bottom:20px" />
      <h2 class="auth-title">Signing out…</h2>
      <p class="auth-sub">Please wait a moment.</p>
    </div>
  </main>

  <script src="vendor/firebase/firebase-app-compat.js"></script>
  <script src="vendor/firebase/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=20261125-2"></script>
  <script src="js/notifications.js?v=20261125-3"></script>
  <script>
    (function () {
      var config = window.PARIPULSE_FIREBASE_CONFIG || {};
      var configured =
        config.apiKey &&
        config.apiKey.indexOf("REPLACE_") === -1 &&
        config.projectId &&
        config.projectId.indexOf("REPLACE_") === -1;

      function done() {
        try {
          window.sessionStorage.removeItem("paripulse_notification_center_v1");
        } catch (error) {
          /* Storage may be unavailable; the redirect still proceeds. */
        }
        window.location.replace("/login/");
      }

      if (!configured || !window.firebase) {
        done();
        return;
      }

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }
        firebase.auth().signOut().then(done, done);
      } catch (error) {
        console.error(error);
        done();
      }
    })();
  </script>
</body>
