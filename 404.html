<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1222" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page not found · Paripulse Management</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/fonts.css?v=20261125-1" />
  <style>
    :root {
      --navy: #0b1222;
      --red: #e11d2e;
      --line: #e4e7ec;
      --muted: #667085;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f5f7fb 55%, #eef2f8 100%);
      color: var(--navy);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
      text-decoration: none;
      color: var(--navy);
    }
    .brand img { width: 46px; height: 46px; }
    .brand-copy { display: flex; flex-direction: column; text-align: left; line-height: 1.05; }
    .brand-name { font-family: "Poppins", sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .04em; }
    .brand-sub { font-size: 9px; font-weight: 600; letter-spacing: .22em; color: var(--muted); }
    .code {
      margin: 0;
      color: var(--red);
      font-family: "Poppins", sans-serif;
      font-size: 84px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    h1 {
      margin: 16px 0 10px;
      font-family: "Poppins", sans-serif;
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.15;
    }
    p {
      margin: 0 auto 28px;
      max-width: 420px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover { background: #c41626; }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--navy); }
    .btn-secondary:hover { border-color: #cfd4dc; background: #f9fafb; }
    .btn:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    footer { margin-top: 42px; color: #98a2b3; font-size: 11.5px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Paripulse Management home">
      <img src="/brand-mark.svg" alt="" width="46" height="46" />
      <span class="brand-copy">
        <span class="brand-name">PARIPULSE</span>
        <span class="brand-sub">MANAGEMENT</span>
      </span>
    </a>

    <p class="code">404</p>
    <h1>This page isn’t here.</h1>
    <p>The link may be broken or the page may have moved. The dashboard is still available from the sign-in page.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-secondary" href="/login/">Admin login</a>
    </div>

    <footer>© 2025–2026 Paripulse Management. All rights reserved.</footer>
  </main>
</body>
</html>
