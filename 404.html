<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe6" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page not found — Paripulse Management</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/fonts.css?v=20261125-2" />
  <link rel="stylesheet" href="/css/theme.css?v=20261125-3" />
  <style>
    :root {
      --paper: #ffffff;
      --surface: #ffffff;
      --ink: #171a1f;
      --ink-soft: #344054;
      --muted: #475467;
      --line: #e4e7ec;
      --accent: #c8322b;
      --editorial: "Poppins", "Instrument Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 560px;
      border-top: 2px solid var(--accent);
      padding-top: 28px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 52px;
      text-decoration: none;
      color: var(--ink);
    }
    .brand img { width: 44px; height: 44px; }
    .brand-copy { display: flex; flex-direction: column; text-align: left; line-height: 1.05; }
    .brand-name { font-family: "Poppins", sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .02em; }
    .brand-sub { margin-top: 4px; font-size: 8px; font-weight: 600; letter-spacing: .26em; color: var(--muted); }
    .code {
      margin: 0;
      color: var(--accent);
      font-family: var(--editorial);
      font-size: clamp(96px, 18vw, 168px);
      font-weight: 600;
      line-height: .78;
      letter-spacing: -0.04em;
    }
    h1 {
      margin: 28px 0 10px;
      font-family: var(--editorial);
      font-size: clamp(32px, 5vw, 46px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.02;
    }
    p {
      margin: 0 0 30px;
      max-width: 44ch;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.65;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background .16s cubic-bezier(.23,1,.32,1), border-color .16s cubic-bezier(.23,1,.32,1), color .16s cubic-bezier(.23,1,.32,1), transform .16s cubic-bezier(.23,1,.32,1);
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
    .btn-primary:hover { background: #9f241f; border-color: #9f241f; }
    .btn-secondary { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
    .btn-secondary:hover { border-color: #c8bead; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    footer { margin-top: 48px; color: var(--muted); font-size: 11.5px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Paripulse Management home">
      <img src="/brand-mark.svg" alt="" width="44" height="44" />
      <span class="brand-copy">
        <span class="brand-name">PARIPULSE</span>
        <span class="brand-sub">MANAGEMENT</span>
      </span>
    </a>

    <p class="code">404</p>
    <h1>This page isn’t here.</h1>
    <p>The link may be broken, or the page may have moved. The demo workspace is available from the sign-in page.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-secondary" href="/login/">Admin login</a>
    </div>

    <footer>© 2025–2026 Paripulse Management. Demo environment — no real funds.</footer>
  </main>
</body>
</html>
